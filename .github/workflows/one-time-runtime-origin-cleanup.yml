name: One-time runtime origin cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace stale hardcoded CORS origin
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/server.js')
          s = p.read_text(encoding='utf-8-sig')
          old = """    // Primary Render frontend URL\n    const renderFrontend = 'https://nexipa.onrender.com';\n    this.allowedOrigins.add(renderFrontend);\n    this.allowedOrigins.add(renderFrontend + '/'); // With trailing slash\n    _slog(`✅ CORS: Allowed production frontend: ${renderFrontend}`);"""
          new = """    // Production frontend origins are configuration-driven. Do not embed a\n    // Render/frontend hostname here because deployments can move without a\n    // source-code change. FRONTEND_URL accepts a comma-separated list.\n    const configuredFrontends = String(this.frontendUrl || '').split(',').map(v => v.trim()).filter(Boolean);\n    configuredFrontends.forEach(origin => {\n        this.allowedOrigins.add(origin);\n        this.allowedOrigins.add(origin.replace(/\\/$/, '') + '/');\n        _slog(`✅ CORS: Allowed configured production frontend: ${origin}`);\n    });"""
          if old not in s:
              raise SystemExit('Expected stale production origin block not found')
          s = s.replace(old, new, 1)
          old2 = """    // CRITICAL: Ensure nexipa.onrender.com is always allowed\n    if (!this.allowedOrigins.has('https://nexipa.onrender.com')) {\n        this.allowedOrigins.add('https://nexipa.onrender.com');\n        _slog(`✅ CORS: Explicitly added nexipa.onrender.com`);\n    }\n    \n"""
          if old2 not in s:
              raise SystemExit('Expected stale explicit origin block not found')
          s = s.replace(old2, '', 1)
          p.write_text(s, encoding='utf-8')
      - name: Verify and remove this workflow
        shell: bash
        run: |
          ! grep -q "nexipa.onrender.com" src/server.js
          ! grep -q "noxopa.onrender.com" src/server.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server.js
          git rm .github/workflows/one-time-runtime-origin-cleanup.yml
          git commit -m "fix cors origins from runtime environment"
          git push origin HEAD:main
